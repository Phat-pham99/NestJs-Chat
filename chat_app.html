<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NestJs Chat App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    #message-input {
      display: flex;
      padding: 10px;
      background: #fff;
    }
    #message-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    #message-input button {
      margin-left: 10px;
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
    }
    #name-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #name-box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    #name-box input {
      width: 200px;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Name prompt -->
  <div id="name-overlay">
    <div id="name-box">
      <h3>Enter your name</h3>
      <input type="text" id="name-input" placeholder="Your name" />
      <button id="name-btn">Join</button>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-container"></div>

  <!-- Message input -->
  <div id="message-input">
    <input type="text" id="msg" placeholder="Type a message..." />
    <button id="send-btn">Send</button>
  </div>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io("http://localhost:3000");
    let clientName = "";

    const chatContainer = document.getElementById("chat-container");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("send-btn");

    const nameOverlay = document.getElementById("name-overlay");
    const nameInput = document.getElementById("name-input");
    const nameBtn = document.getElementById("name-btn");

    // Set name and join chat
    nameBtn.addEventListener("click", () => {
      const name = nameInput.value.trim();
      if (!name) return;
      clientName = name;
      socket.emit("set_name", clientName);
      nameOverlay.style.display = "none";
    });

    // Sending message
    sendBtn.addEventListener("click", () => {
      const message = msgInput.value.trim();
      if (!message) return;
      socket.emit("message", { message });
      msgInput.value = "";
    });

    // Send on Enter key
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendBtn.click();
    });

    // Display incoming messages
    socket.on("message", (data) => {
      const div = document.createElement("div");
      div.innerHTML = `<strong>${data.name}:</strong> ${data.message}`;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    socket.on("disconnect", () => {
      const div = document.createElement("div");
      div.style.color = "red";
      div.textContent = "Disconnected from server";
      chatContainer.appendChild(div);
    });

    socket.on("connect_error", (err) => {
      console.error("Connection error:", err.message);
    });
  </script>

</body>
</html>
